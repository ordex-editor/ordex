name: macOS CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Install LSP servers needed for tests
        run: |
          brew install llvm python-lsp-server ruff ty cargo-nextest
          # typescript-language-server cannot locate TypeScript 7, so both it and
          # the compiler are held at the versions known to work together.
          npm install -g typescript-language-server@6.0.0 typescript@6.0.3

      # Diagnostic only: a version probe must never be the reason CI goes red,
      # so every command here tolerates a server that failed to install.
      - name: Report LSP server versions
        run: |
          clangd --version || true
          pylsp --version || true
          ruff --version || true
          ty --version || true
          typescript-language-server --version || true
          tsc --version || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-analyzer

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build release binary
        run: cargo build --release

      - name: Run tests
        run: cargo nextest run --profile ci -- --include-ignored

      # Enable tmate debugging of manually-triggered workflows if the input option was provided
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
