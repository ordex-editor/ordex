name: macOS CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Install LSP servers needed for tests
        run: |
          brew install llvm python-lsp-server ruff ty cargo-nextest
          # typescript-language-server cannot locate TypeScript 7, so both it and
          # the compiler are held at the versions known to work together.
          npm install -g typescript-language-server@6.0.0 typescript@6.0.3

      # Diagnostic only: a version probe must never be the reason CI goes red,
      # so every command here tolerates a server that failed to install.
      - name: Report LSP server versions
        run: |
          clangd --version || true
          pylsp --version || true
          ruff --version || true
          ty --version || true
          typescript-language-server --version || true
          tsc --version || true

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-analyzer

      - name: Build tests
        run: cargo test --test lsp_liveness_test --no-run

      - name: Stress the unanswered lookup test
        if: always()
        run: |
          failures=0
          for round in $(seq 10); do
            for copy in 1 2 3; do
              cargo test -q --test lsp_liveness_test -- --exact test_unanswered_lookup_fails_once_the_language_server_exits > "stress_${round}_${copy}.log" 2>&1 &
            done
            wait
          done
          for log in stress_*.log; do
            if grep -q "panicked" "$log"; then
              failures=$((failures + 1))
              echo "::group::$log"
              cat "$log"
              echo "::endgroup::"
            fi
          done
          echo "stress failures: $failures of 30"

      - name: Run the LSP suites as CI does
        if: always()
        run: |
          for attempt in 1 2; do
            cargo nextest run --profile ci -E 'binary(/^lsp_/)' --no-fail-fast -- --include-ignored || true
          done

      # Enable tmate debugging of manually-triggered workflows if the input option was provided
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
